<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- O `flutter build` troca pelo valor de --base-href (o app mora na raiz). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{= display_name =}</title>
  <meta name="description" content="{= description =}">
  <meta name="application-name" content="{= display_name =}">
  <meta name="theme-color" content="#0E1013">
  <meta name="color-scheme" content="dark">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="manifest" href="manifest.json">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{= display_name =}">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{= display_name =}">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="{= display_name =}">
  <meta property="og:description" content="{= description =}">

  <!-- Enquanto o Flutter carrega: o fundo do app e a logo, sem o clarão branco -->
  <style>
    html, body { margin: 0; height: 100%; background: #0E1013; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              gap: 18px; background: radial-gradient(circle at 50% 38%, #{= colors.glow =} 0%, #0E1013 60%); transition: opacity .35s ease; }
    #splash.out { opacity: 0; }
    #splash img { width: 72px; height: 72px; filter: drop-shadow(0 10px 28px rgba({= colors.accent_rgb =}, .35)); animation: pulse 1.6s ease-in-out infinite; }
    #splash span { font: 600 15px/1 system-ui, -apple-system, Roboto, sans-serif; letter-spacing: .4px; color: #7f8a89; }
    @keyframes pulse { 50% { transform: scale(.94); opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="favicon.svg" alt="">
    <span>{= display_name =}</span>
  </div>
  <noscript>O {= display_name =} precisa de JavaScript ligado para funcionar.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
